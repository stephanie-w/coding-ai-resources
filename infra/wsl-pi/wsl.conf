# /etc/wsl.conf for the dedicated *pi* distro.
#
# Copy to /etc/wsl.conf inside the pi distro, then restart it:
#   wsl --terminate pi
#
# Goal: shrink what an agentic *accident* can name. See ../README.md.

[automount]
# Do NOT auto-mount Windows drives. With this off there is no /mnt/c, so the
# agent cannot name C:\Users\... or anything else on the Windows host.
enabled = false
# Still process /etc/fstab — this is where the single, deliberate bridge to the
# dev distro's ~/DEV lives (see fstab.example). Independent of `enabled`.
mountFsTab = true

[interop]
# The agent cannot execute Windows binaries (powershell.exe, cmd.exe, ...).
# This is the other half of "cannot reach the Windows host by accident".
enabled = false
# Do not leak C:\... into $PATH.
appendWindowsPath = false

[network]
generateResolvConf = true
generateHosts = true

[user]
# The unprivileged user pi runs as. Must exist (see README provisioning).
default = pi

[boot]
# pi needs no init system; keep the guest lean.
systemd = false
# Alternative to /etc/fstab for the ~/DEV bridge (avoids fstab backslash
# escaping). Uncomment after creating /etc/pi-wsl.env with DEV_DISTRO/DEV_USER.
# command = /root/wsl-pi/mount-dev.sh --boot
